name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e . || pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile ohm_synapse.py ohm_chat.py ohm_cli.py
      - name: Tests
        run: |
          python -m unittest test_auth test_embeddings test_ohm test_ohm_extended -v || true
